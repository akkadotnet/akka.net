# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [dev, v1.*, master, feature/*] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - job: DocsSpellcheck
    displayName: "Docs: Spellcheck"
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self # self represents the repo where the initial Pipelines YAML file was found
        clean: false # whether to fetch clean each time
        submodules: recursive # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
      - task: NodeTool@0
        inputs:
          versionSpec: "16.x"
      - task: Npm@1
        inputs:
          command: "custom"
          customCommand: "install -g cspell@6.12.0"
      - task: CmdLine@2
        inputs:
          script: 'cspell --config ./docs/cSpell.json "docs/**/*.md"'

  - job: DocsMarkdownLinting
    displayName: "Docs: Markdown Linting"
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self # self represents the repo where the initial Pipelines YAML file was found
        clean: false # whether to fetch clean each time
        submodules: recursive # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
      - task: NodeTool@0
        inputs:
          versionSpec: "12.x"
      - task: Npm@1
        inputs:
          command: "custom"
          customCommand: "install -g markdownlint-cli@0.31.0 markdownlint-rule-titlecase@0.1.0"
      - task: CmdLine@2
        inputs:
          script: 'markdownlint "docs/**/*.md" --rules "markdownlint-rule-titlecase"'

  - job: SlopwatchAnalysis
    displayName: "Slopwatch: LLM Code Quality Check"
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        clean: false
        submodules: recursive
      - task: UseDotNet@2
        displayName: 'Use .NET'
        inputs:
          packageType: 'sdk'
          useGlobalJson: true
      - script: dotnet tool restore
        displayName: 'Restore .NET Tools'
      - script: dotnet slopwatch analyze -d . --fail-on error --stats
        displayName: 'Run Slopwatch Analysis'

  - template: azure-pipeline.template.yaml
    parameters:
      name: "docfx_test"
      displayName: "DocFX warning check"
      vmImage: "windows-latest"
      command: |
        dotnet docfx metadata ./docs/docfx.json --warningsAsErrors
        dotnet docfx build ./docs/docfx.json --warningsAsErrors
      outputDirectory: "TestResults"
      artifactName: "docfx_test-$(Build.BuildId)"
      run_if: eq(variables['Build.Reason'], 'PullRequest')
      
  - template: azure-pipeline.template.yaml
    parameters:
      name: "net_tests_windows"
      displayName: ".NET Unit Tests (Windows)"
      vmImage: "windows-latest"
      command: "dotnet incrementalist run --config .incrementalist/testsOnly.json --branch $(IncrementalistBaseBranch) -- test -c Release --no-build --framework net10.0 --logger:trx --results-directory TestResults"
      outputDirectory: "TestResults"
      artifactName: "net_tests_windows-$(Build.BuildId)"

  - template: azure-pipeline.template.yaml
    parameters:
      name: "net_tests_linux"
      displayName: ".NET Unit Tests (Linux)"
      vmImage: "ubuntu-latest"
      command: "dotnet incrementalist run --config .incrementalist/testsOnly.json --branch $(IncrementalistBaseBranch) -- test -c Release --no-build --framework net10.0 --logger:trx --results-directory TestResults"
      outputDirectory: "TestResults"
      artifactName: "net_tests_linux-$(Build.BuildId)"

  - template: azure-pipeline.mntr-template.yaml
    parameters:
      name: "net_mntr_windows"
      displayName: ".NET Multi-Node Tests (Windows)"
      vmImage: "windows-latest"
      command: "dotnet incrementalist run --config .incrementalist/mutliNodeOnly.json --branch $(IncrementalistBaseBranch) -- test -c Release --no-build --framework net10.0 --logger:trx --results-directory TestResults/multinode"
      outputDirectory: "TestResults"
      artifactName: "net_mntr_windows-$(Build.BuildId)"
      mntrFailuresDir: 'TestResults\\multinode'
      mntrFailuresArtifactName: "net_7_mntr_FAILED_windows-$(Build.BuildId)"

  # Independent, parallel, NON-BLOCKING Artery MNTR stage. Runs the exact same
  # incrementally-scoped multi-node suite as "net_mntr_windows" above, but
  # re-points the transport at Artery via AKKA_MNTR_TRANSPORT=artery, which
  # MultiNodeConfig.Config layers in as a low-priority fallback config tier
  # (see src/core/Akka.Remote.TestKit/MultiNodeSpec.cs). Purpose: track
  # Artery's own MNTR green-rate as a ship-confidence metric, independent of
  # classic DotNetty, without gating PR validation on it.
  #
  # Non-blocking: continueOnError: true is set at the job level (in
  # azure-pipeline.mntr-template.yaml), not just on the test step. The job
  # still runs and reports its own pass/fail per PR (visible in the Checks
  # list), but it can never fail PR validation as a whole.
  #
  # Known/accepted noise: Artery has no failure-injection test-mode yet
  # (no equivalent to classic DotNetty's trttl/gremlin transport adapters),
  # so any spec that calls TestConductor Throttle/Blackhole/PassThrough will
  # fail fast on the RequireTestConductorTransport() check in
  # src/core/Akka.Remote.TestKit/Conductor.cs instead of exercising real
  # behavior. There is no clean way to exclude just these specs today:
  # incrementalist filters by project, not by test class, and the
  # MultiNodeFact Skip/SkipWhen mechanism would require touching every one
  # of the spec files below. Until an Artery test-mode transport lands, treat
  # failures from this stage as expected noise on top of the specs listed
  # here (~29-30 known offenders, grouped by project):
  #   Akka.Cluster.Sharding.Tests.MultiNode: ClusterShardCoordinatorDowning2Spec,
  #     ClusterShardCoordinatorDowningSpec, ClusterShardingFailureSpec,
  #     ClusterShardingSingleShardPerEntitySpec
  #   Akka.Cluster.Tools.Tests.MultiNode: ClusterClientSpec,
  #     ClusterSingletonManagerDownedSpec
  #   Akka.DistributedData.Tests.MultiNode: JepsenInspiredInsertSpec,
  #     ReplicatorChaosSpec, ReplicatorSpec
  #   Akka.Cluster.Tests.MultiNode: AttemptSysMsgRedeliverySpec,
  #     ClusterAccrualFailureDetectorSpec, InitialHeartbeatSpec,
  #     MemberWeaklyUpSpec, RestartNode3Spec, ClusterRoundRobinSpec,
  #     DownAllIndirectlyConnected5NodeSpec, DownAllUnstable5NodeSpec,
  #     IndirectlyConnected3NodeSpec, IndirectlyConnected5NodeSpec,
  #     LeaseMajority5NodeSpec, SplitBrainResolverDowningSpec, SplitBrainSpec,
  #     StressSpec, SurviveNetworkInstabilitySpec, UnreachableNodeJoinsAgainSpec
  #   Akka.Remote.Tests.MultiNode: AttemptSysMsgRedeliverySpec,
  #     RemoteNodeRestartDeathWatchSpec, RemoteNodeShutdownAndComesBackSpec,
  #     RemoteReDeploymentSpec (+ its Fast/Medium/Slow MultiNet variants),
  #     TestConductorSpec
  - template: azure-pipeline.mntr-template.yaml
    parameters:
      name: "net_mntr_windows_artery"
      displayName: ".NET Multi-Node Tests (Windows, Artery)"
      vmImage: "windows-latest"
      command: "dotnet incrementalist run --config .incrementalist/mutliNodeOnly.json --branch $(IncrementalistBaseBranch) -- test -c Release --no-build --framework net10.0 --logger:trx --results-directory TestResults/multinode"
      outputDirectory: "TestResults"
      artifactName: "net_mntr_windows_artery-$(Build.BuildId)"
      mntrFailuresDir: 'TestResults\\multinode'
      mntrFailuresArtifactName: "net_mntr_artery_FAILED_windows-$(Build.BuildId)"
      continueOnError: true
      env:
        AKKA_MNTR_TRANSPORT: artery

  - template: azure-pipeline.template.yaml
    parameters:
      name: "nuget_pack"
      displayName: "NuGet Pack"
      vmImage: "windows-latest"
      command: "dotnet pack -c Release -o bin/nuget"
      outputDirectory: "bin/nuget"
      artifactName: "nuget_pack-$(Build.BuildId)"
