############################################
# Akka Cluster Tools Reference Config File #
############################################

# This is the reference config file that contains all the default settings.
# Make your edits/overrides in your application.conf.

# //#pub-sub-ext-config
# Settings for the DistributedPubSub extension
akka.cluster.pub-sub {
  # Actor name of the mediator actor, /system/distributedPubSubMediator
  name = distributedPubSubMediator

  # Start the mediator on members tagged with this role.
  # All members are used if undefined or empty.
  role = ""

  # The routing logic to use for 'Send'
  # Possible values: random, round-robin, broadcast
  routing-logic = random

  # How often the DistributedPubSubMediator should send out gossip information
  gossip-interval = 1s

  # Removed entries are pruned after this duration
  removed-time-to-live = 120s

  # Maximum number of elements to transfer in one message when synchronizing the registries.
  # Next chunk will be transferred in next round of gossip.
  max-delta-elements = 3000

  # When a message is published to a topic with no subscribers send it to the dead letters.
  send-to-dead-letters-when-no-subscribers = on

  # When set to 'true', mediator will buffer messages that are failed to be published or sent
  # because there are no subscribers in the cluster. 
  # Default: false
  wait-for-subscribers = false
  
  # 'buffered-messages' only being used when 'wait-for-subscribers' is set to 'true'  
  buffered-messages {
    # Set the maximum message buffer size for each topic. 
    # Default: 1000 messages
    max-per-topic = 1000
  
    # The time span of how long an unsent message is being kept inside the buffer before it is 
    # ultimately being sent to dead letter.
    # Default: 1 minute
    timeout = 1m
  
    # The interval on which all buffered message will be checked for timeout condition.
    # Default: 1 seconds
    timeout-check-interval = 1s
  
    # Determine how mediator will behave when a topic buffer overflowed.
    # Valid values are 'drop-head', 'drop-tail', 'drop-buffer', 'drop-new', and 'fail'.
    # Default: fail
    overflow-strategy = fail
  }

  # The id of the dispatcher to use for DistributedPubSubMediator actors.
  # If not specified, the internal dispatcher is used.
  # If specified you need to define the settings of the actual dispatcher.
  use-dispatcher = ""

}
# //#pub-sub-ext-config

# Protobuf serializer for cluster DistributedPubSubMediator messages
akka.actor {
  serializers {
    akka-pubsub = "Akka.Cluster.Tools.PublishSubscribe.Serialization.DistributedPubSubMessageSerializer, Akka.Cluster.Tools"
  }
  serialization-bindings {
    "Akka.Cluster.Tools.PublishSubscribe.IDistributedPubSubMessage, Akka.Cluster.Tools" = akka-pubsub
	"Akka.Cluster.Tools.PublishSubscribe.Internal.SendToOneSubscriber, Akka.Cluster.Tools" = akka-pubsub
  }
  serialization-identifiers {
    "Akka.Cluster.Tools.PublishSubscribe.Serialization.DistributedPubSubMessageSerializer, Akka.Cluster.Tools" = 9
  }
}